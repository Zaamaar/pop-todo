<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D6EEF0">
<title>Pop: a todo list you pop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Pop</h1>
  <p class="sub">Add a task. Pop the balloon when it's done.</p>

  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="What needs doing?" aria-label="New task" maxlength="120">
    <button class="add" type="submit">Add task</button>
  </form>

  <ul id="list" aria-live="polite"></ul>
  <div class="empty" id="empty" hidden>Nothing left to pop. Add a task above.</div>

  <footer>
    <div class="tally"><strong id="left">0</strong> to pop <strong class="p" id="done">0</strong> popped</div>
    <div class="hint">Press a balloon to complete</div>
  </footer>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="app.js"></script>
</body>
</html>
